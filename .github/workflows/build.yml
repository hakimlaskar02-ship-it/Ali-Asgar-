name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Find Project Root
        run: |
          if [ -f *.zip ]; then
            unzip *.zip -d extracted_files
          else
            mkdir extracted_files
            cp -r * extracted_files/ 2>/dev/null || true
          fi
          
          PROJECT_DIR=$(find extracted_files -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build with Gradle and Generate APK
        run: |
          cd $PROJECT_DIR
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
					
